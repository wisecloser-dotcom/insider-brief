name: Backtest insider strategies

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Insider data source: openinsider (has filing times) or sec (fallback)"
        default: openinsider
        type: choice
        options: [openinsider, sec]
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2015-01-01"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backtest/requirements.txt

      - name: Restore downloaded data
        uses: actions/cache@v4
        with:
          path: backtest/data
          key: backtest-data-${{ github.run_id }}
          restore-keys: backtest-data-

      - run: pip install -r backtest/requirements.txt

      - name: Fetch insider purchases
        run: python backtest/fetch_insiders.py --source ${{ inputs.source }} --start ${{ inputs.start }}

      - name: Fetch prices
        run: python backtest/fetch_prices.py

      - name: Run backtest
        run: python backtest/run_backtest.py

      - name: Show summary on the run page
        run: cat backtest/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git commit -m "Backtest results (${{ inputs.source }}, from ${{ inputs.start }})" || echo "No changes"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest/results
