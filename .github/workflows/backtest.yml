name: Backtest insider strategies

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Insider data source: openinsider (has filing times) or sec (fallback)"
        default: openinsider
        type: choice
        options: [openinsider, sec]
      start:
        description: "Start date (YYYY-MM-DD)"
        default: "2015-01-01"
      price_minutes:
        description: "Max minutes to spend downloading prices (re-run to continue)"
        default: "200"
      task:
        description: "What to run: the strategy backtest, or the cluster-buy test"
        default: backtest
        type: choice
        options: [backtest, cluster, strategy]
      hold:
        description: "Cluster test only: trading days to hold"
        default: "20"
      move:
        description: "Cluster test only: max % the price may have moved since insiders bought"
        default: "3"
      window:
        description: "Cluster test only: days within which 2+ insiders must buy"
        default: "14"
      tp:
        description: "Strategy only: take-profit % within the first 5 trading days (0 = none)"
        default: "10"
      hold_days:
        description: "Strategy only: calendar days to hold if no take-profit or cluster sell"
        default: "30"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BT_START: ${{ inputs.start }}
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backtest/requirements.txt

      - name: Restore downloaded data
        uses: actions/cache/restore@v4
        with:
          path: backtest/data
          key: backtest-data-${{ github.run_id }}
          restore-keys: backtest-data-

      - run: pip install -r backtest/requirements.txt

      - name: Fetch insider purchases
        run: |
          mkdir -p backtest/results/logs
          python -u backtest/fetch_insiders.py --source ${{ inputs.source }} --start ${{ inputs.start }} 2>&1 | tee backtest/results/logs/1_fetch_insiders.txt

      - name: Fetch insider sales
        if: inputs.task == 'strategy'
        run: python -u backtest/fetch_insiders.py --kind sales --start ${{ inputs.start }} 2>&1 | tee backtest/results/logs/1b_fetch_sales.txt

      - name: Fetch prices
        run: python -u backtest/fetch_prices.py --max-minutes ${{ inputs.price_minutes }} 2>&1 | tee backtest/results/logs/2_fetch_prices.txt

      - name: Run backtest
        if: inputs.task == 'backtest'
        run: python -u backtest/run_backtest.py 2>&1 | tee backtest/results/logs/3_run_backtest.txt

      - name: Run cluster-buy test
        if: inputs.task == 'cluster'
        run: |
          mkdir -p backtest/results/cluster
          python -u backtest/cluster_test.py --hold ${{ inputs.hold }} --move ${{ inputs.move }} --window ${{ inputs.window }} 2>&1 | tee backtest/results/cluster/log.txt

      - name: Run strategy test
        if: inputs.task == 'strategy'
        run: |
          mkdir -p backtest/results/strategy
          python -u backtest/strategy_test.py --tp ${{ inputs.tp }} --move ${{ inputs.move }} --hold ${{ inputs.hold_days }} --window ${{ inputs.window }} 2>&1 | tee backtest/results/strategy/log.txt

      # Everything below runs even if a step above failed, so progress and logs are kept.
      - name: Save downloaded data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: backtest/data
          key: backtest-data-${{ github.run_id }}

      - name: Show summary on the run page
        if: always()
        run: |
          f=backtest/results/summary.md; [ "${{ inputs.task }}" = cluster ] && f=backtest/results/cluster/summary.md; [ "${{ inputs.task }}" = strategy ] && f=backtest/results/strategy/summary.md
          if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY";
          else echo "No summary - see backtest/results/logs" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit results and logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/results
          git commit -m "Backtest results (${{ inputs.task }}, ${{ inputs.source }}, from ${{ inputs.start }}, run ${{ github.run_id }})" || echo "No changes"
          git pull --rebase origin ${{ github.ref_name }} && git push

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest-results
          path: backtest/results
