name: Cluster-buy test

on:
  workflow_dispatch:
    inputs:
      hold:
        description: "Trading days to hold"
        default: "20"
      move:
        description: "Max % the price may have moved since insiders bought"
        default: "3"
      window:
        description: "Days within which 2+ insiders must buy"
        default: "14"

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: bash -o pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backtest/requirements.txt

      - name: Restore downloaded data (from the main backtest)
        uses: actions/cache/restore@v4
        with:
          path: backtest/data
          key: backtest-data-cluster-${{ github.run_id }}
          restore-keys: backtest-data-

      - run: pip install -r backtest/requirements.txt

      - name: Download data if the cache was empty
        run: |
          mkdir -p backtest/results/cluster
          if [ ! -f backtest/data/insiders.parquet ]; then
            python -u backtest/fetch_insiders.py --source openinsider
            python -u backtest/fetch_prices.py
          else
            echo "Using cached data"
          fi

      - name: Run cluster test
        run: python -u backtest/cluster_test.py --hold ${{ inputs.hold }} --move ${{ inputs.move }} --window ${{ inputs.window }} 2>&1 | tee backtest/results/cluster/log.txt

      - name: Show summary on the run page
        if: always()
        run: |
          if [ -f backtest/results/cluster/summary.md ]; then cat backtest/results/cluster/summary.md >> "$GITHUB_STEP_SUMMARY";
          else echo "No summary - see backtest/results/cluster/log.txt" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add backtest/results/cluster
          git commit -m "Cluster-buy test results (hold ${{ inputs.hold }}, move ${{ inputs.move }}%, window ${{ inputs.window }}d, run ${{ github.run_id }})" || echo "No changes"
          git pull --rebase origin ${{ github.ref_name }} && git push
